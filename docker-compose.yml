services:
  ledger-standardizer:
    build: .
    image: carbon-ledger-standardizer:latest
    container_name: carbon-ledger-standardizer
    ports:
      - "8000:8000"
    environment:
      - RESULTS_DIR=/srv/var/results
    volumes:
      # Result CSVs live on a real volume, not in memory and not on tmpfs
      # (tmpfs pages count against the container memory limit).
      - results:/srv/var/results
    mem_limit: 384m
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  results:
