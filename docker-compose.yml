services:
  ledger-standardizer:
    build: .
    image: carbon-ledger-standardizer:latest
    container_name: carbon-ledger-standardizer
    ports:
      - "8000:8000"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
